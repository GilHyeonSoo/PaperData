scenario_runner:
  parallel: true
  max_workers: 5
  output_root: outputs/scenarios

wallclock_runner:
  target_seconds: 3600
  max_workers: 5
  output_root: outputs/scenarios_wallclock
  models: [A, B, C, D]
  duration: 10800
  mission_interval: 10
  time_step: 10
  conflict_time_step: 20
  max_departure_delay: 300
  delay_step: 60
  seed_start: 1000
  report_interval_seconds: 60

scenarios:
  S1:
    description: 1500m 확장형 도시, 1.5시간 누적 운항
    model: D
    map:
      width: 1500
      height: 1500
      grid_size: 50
      road_width: 10
      building_density: 0.35
    vertiports:
      count: 8
    aircraft:
      fleet_size: 75
      cruise_speed_kmh: 240
    simulation:
      random_seed: 101
      duration: 5400
      mission_interval: 30
      time_step: 10
      conflict_time_step: 20
      max_departure_delay: 300
      delay_step: 60

