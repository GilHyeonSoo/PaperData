scenario_runner:
  parallel: true
  max_workers: 6
  output_root: outputs/scenarios_v2

wallclock_runner:
  target_seconds: 3600
  max_workers: 6
  output_root: outputs/scenarios_wallclock_v2
  models: [A, B, C, D, E]
  duration: 10800
  mission_interval: 10
  time_step: 10
  conflict_time_step: 20
  max_departure_delay: 300
  delay_step: 60
  seed_start: 1000
  report_interval_seconds: 60

scenarios:
  S1:
    description: 소형 고혼잡 도시 시나리오
    model: E
    map:
      width: 1500
      height: 1500
      grid_size: 50
      road_width: 10
      building_density: 0.35
    vertiports:
      count: 8
      pad_occupancy_enabled: true
    aircraft:
      fleet_size: 75
      cruise_speed_kmh: 240
    simulation:
      random_seed: 101
      duration: 5400
